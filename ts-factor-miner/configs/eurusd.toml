# EURUSD (spot) factor-mining config.
# NOTE: ACM term premium (class_two=ACM) is deliberately EXCLUDED from the universe:
# it is a model series re-estimated on the full sample, so its historical values look ahead.

[target]
name = "EURUSD"
kind = "spot"
ticker = "EURUSD BGN Curncy"
field = "PX_LAST"           # daily return = log difference of this series
cost_per_side = 0.00005

[databank]
toolkit_dir = "/home/user/databank-work/entry"
cache_dir = "/home/user/databank-work/databank-cache"

[sample]
start = ""                  # 可选 ISO 日期; 空 = 标的全部历史
is_frac = 0.70              # 每个候选在自己与标的重叠的有效行内切成: 样本内 IS 70% / 观察期 OBS 15% / 样本外 OOS 15%
obs_frac = 0.15

[universe]
fields = ["PX_LAST", "CFTC_CONTRACTS"]   # 字段优先级: 每个 ticker 取它拥有的第一个
chains = ["TY","TU","FV","US","RX","OE","DU","G","OAT","IK"]
carry_chains = []
exclude_tickers = []

[[universe.select]]
class_two = "FX"
class_three = ["Currency", "Currency_Index", "Cross_Currency_Basis"]

[[universe.select]]
tickers = ["EURUSD1W BGN Curncy", "EURUSD1M BGN Curncy", "EURUSD3M BGN Curncy", "EURUSD6M BGN Curncy", "EURUSD12M BGN Curncy"]

[[universe.select]]
class_two = "VOL"

[[universe.select]]
class_two = "Government_Bond"
class_three = ["Yield", "Bill", "Govt_Spread"]

[[universe.select]]
class_two = "Money_Market"
# MM_Future (近月连续合约) 已移出候选池: 换月跳空无法在现有数据上修正
class_three = ["Benchmark_Rate", "Implied_Yield"]

[[universe.select]]
class_two = "Swap_OIS"
class_three = ["SOFR_OIS", "ESTR_OIS", "Swap_Spread"]

[[universe.select]]
class_two = "Equity"
class_three = ["Equity_Index", "Style"]

[[universe.select]]
# 不含 Commodity_Future (近月连续合约): 换月跳空无法在现有数据上修正, 先移出候选池
class_two = "Commodity"
class_three = ["Commodity_Index", "Spot"]

[[universe.select]]
class_two = "Credit"

[[universe.select]]
class_two = "Inflation_Linked"
class_three = ["Breakeven", "TIPS_Yield", "Inflation_Swap"]

[[universe.select]]
class_one = "Macro"
class_three = ["Surprise_Index", "Financial_Conditions"]

[[universe.select]]
class_two = "CFTC_COT"
class_three = ["US_Dollar_Index"]

# US2Y-DE2Y dropped: no German 2Y govt yield ticker in the databank (GTDEM2Y Govt does not exist).
[[universe.spread]]
id = "US10Y-DE10Y"
a = "USGG10YR Index"
b = "GTDEM10Y Govt"

[[universe.spread]]
id = "SOFR2Y-ESTR2Y"
a = "USISSO02 Index"
b = "EESWE2 Curncy"

[[universe.spread]]
id = "CESIUSD-CESIEUR"
a = "CESIUSD Index"
b = "CESIEUR Index"

[lags]
# 可得性(availability)是【输入】, 由研究者确认, 系统不猜测、不套默认值: 没有规则的序列会被拒收(no_availability_rule)。
# 数值含义: t 日收盘的信号只能用日期 <= t-lag 的观测。
# 优先级: [lags.ticker] 精确 ticker > [lags.class] 的 "class_one/class_two"。
chain = 1      # 期货链 chain:* 与 carry:* 的滞后

[lags.class]
"Market_Data/Government_Bond" = 1
"Market_Data/Money_Market" = 1
"Market_Data/Swap_OIS" = 1
"Market_Data/VOL" = 1
"Market_Data/Commodity" = 1
"Market_Data/Equity" = 1
"Market_Data/Inflation_Linked" = 1
"Market_Data/Credit" = 1
"Market_Data/MBS" = 1
"Market_Data/FX" = 1
"Macro/Global" = 1
"Macro/US" = 1
"Positioning/CFTC_COT" = 4     # 周二数据、周五 15:30 ET 发布 -> 下周一可用
"FED/Balance_Sheet" = 2        # 周三数据、周四 16:30 ET 发布 -> 周五可用
"FED/Primary_Dealer" = 8       # 周三数据、下周四发布 -> 保守取 8

[lags.ticker]
"NFCIINDX Index" = 6

[position]
# 连续仓位 = sign * 信号(按波动率缩放的 y 单位); 缓冲带: 目标与当前仓位之差的绝对值 > buffer 才调仓,
# 否则维持原仓位。buffer = 0 即每天跟随目标; 慢信号不必每天调仓。
buffer = 0.5

[signals]
std_window = 252
clip = 4.0
vol_halflife = 20

[stats]
hac_lags = 5
min_obs = 250    # 每个候选在样本内(IS)至少需要的有效观测数, 不足者不检验
n_boot = 1000
min_shift = 60
seed = 20261122

[verdict]
# 每个候选都是独立的单因子检验:
#   z = HAC t ÷ 该候选自身循环平移零分布的标准差, 只用该候选自己的样本内(IS)行。
#   |z| >= z_pass 为 PASS; z_weak <= |z| < z_pass 为 WEAK_PASS; 其余为 REJECT。
#   门槛不随样本长度变: 同样的 z 在短样本上对应更高的 IC (IC ≈ z ÷ sqrt(n_is))。
# 通过门槛的候选进入观察期(OBS)筛选, 未被淘汰的再按相关性去重, 代表组成 shortlist;
# 样本外(OOS)由 confirm 确认(只打开一次, 不据此再调整)。
z_pass = 2.5
z_weak = 2.0
dedupe_corr = 0.7        # 去重: 开发样本(IS+OBS)共同行上信号相关系数绝对值 >= 此值归入同一代表
extra_lag_t_min = 2.0    # xlag_weak 提示: 信号再多滞后一天后 |t| 低于此值(或变号)
obs_min_retention = 0.5  # 观察期保留条件: 按样本内符号的观察期 IC ÷ |样本内 IC| >= 此值; confirm 的 CONSISTENT 也用它
year_hit_min = 0.6       # 逐年 IC 为正的年份占比低于此值(且计入年数 >= 3)则标 unstable
