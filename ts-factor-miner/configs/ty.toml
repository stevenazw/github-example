# TY (10Y T-Note futures) factor-mining config.
# NOTE: ACM term premium (class_two=ACM) is deliberately EXCLUDED from the universe:
# it is a model series re-estimated on the full sample, so its historical values look ahead.

[target]
name = "TY"
kind = "futures_chain"      # "futures_chain" | "spot"
root = "TY"                 # used by futures_chain
# ticker / field             # used by spot: log difference of PX_LAST is the daily return
cost_per_side = 0.00014     # 单边成本(收益率单位): TY 半个 tick 1/64 点 ÷ 价格约 110

[databank]
toolkit_dir = "/home/user/databank-work/entry"
cache_dir = "/home/user/databank-work/databank-cache"

[sample]
start = ""                  # 可选 ISO 日期; 空 = 标的全部历史
holdout_frac = 0.2          # 每个候选在自己与标的重叠的样本上独立检验, 并各自把最后 holdout_frac 的有效行留作 holdout

[universe]
fields = ["PX_LAST", "CFTC_CONTRACTS"]   # 字段优先级: 每个 ticker 取它拥有的第一个
chains = ["TY","TU","FV","US","WN","UB","UXY","RX","OE","DU","G","WB","CN","CV","XQ","LGB","OAT","IK"]
carry_chains = ["TY","TU","FV","US"]
exclude_tickers = []

[[universe.select]]
class_two = "Government_Bond"
class_three = ["Yield", "Bill", "Govt_Spread"]

[[universe.select]]
class_two = "Money_Market"
class_three = ["MM_Future", "Benchmark_Rate", "Implied_Yield", "MM_Spread", "Repo"]

[[universe.select]]
class_two = "Swap_OIS"
class_three = ["SOFR_OIS", "Swap_Spread", "Forward_Swap"]

[[universe.select]]
class_two = "VOL"

[[universe.select]]
class_two = "Commodity"

[[universe.select]]
class_two = "Equity"
class_three = ["Equity_Index", "Style"]

[[universe.select]]
class_two = "Inflation_Linked"
class_three = ["Breakeven", "TIPS_Yield", "Inflation_Swap"]

[[universe.select]]
class_two = "Credit"

[[universe.select]]
class_two = "MBS"
class_three = ["Current_Coupon", "OAS"]

[[universe.select]]
class_two = "FX"
class_three = ["Currency", "Currency_Index", "Cross_Currency_Basis"]

[[universe.select]]
class_one = "Macro"
class_three = ["Surprise_Index", "Financial_Conditions"]

[[universe.select]]
family = "CFTC"
attrs = { direction = "Net", report = "Futures Only" }

[[universe.select]]
class_one = "FED"
class_two = "Balance_Sheet"

[[universe.select]]
class_one = "FED"
class_two = "Primary_Dealer"

[[universe.spread]]
id = "US10Y-DE10Y"
a = "USGG10YR Index"
b = "GTDEM10Y Govt"

[[universe.spread]]
id = "US5s30s"
a = "USGG30YR Index"
b = "USGG5YR Index"

[[universe.spread]]
id = "US3M10Y"
a = "USGG10YR Index"
b = "USGG3M Index"

[lags]
D = 1          # 日频默认: t 日收盘的信号只用 <= t-1 日的 x (保守: 不假设 x 的取值时刻早于标的收盘)
W = 6          # 周频默认: 保守覆盖"下周才发布"的情形

[lags.class]   # 键为 "class_one/class_two", 优先于频率默认
"Positioning/CFTC_COT" = 4     # 周二数据、周五 15:30 ET 发布 -> 下周一可用
"FED/Balance_Sheet" = 2        # 周三数据、周四 16:30 ET 发布 -> 周五可用
"FED/Primary_Dealer" = 8       # 周三数据、下周四发布 -> 保守取 8

[lags.ticker]  # 可选: 按 ticker 精确覆盖, 优先级最高 (默认空)

[signals]
std_window = 252
clip = 4.0
vol_halflife = 20

[stats]
hac_lags = 5
min_obs = 250    # 每个候选在 train 段至少需要的有效观测数, 不足者不检验
n_boot = 1000
min_shift = 60
seed = 20261122

[verdict]
# 每个候选都是独立的单因子检验(没有"同批"概念, 不做族错误率 / FDR 校正):
#   z = HAC t ÷ 该候选自身循环平移零分布的标准差, 只用该候选自己的 train 行。
#   |z| >= z_pass 为 PASS; z_weak <= |z| < z_pass 为 WEAK_PASS; 其余为 REJECT。
#   门槛不随样本长度变: 同样的 z 在短样本上对应更高的 IC (IC ≈ z ÷ sqrt(n_train))。
# 通过门槛的候选再按相关性去重, 代表组成 shortlist; 成立与否由 holdout 确认(只打开一次)。
z_pass = 2.5
z_weak = 2.0
dedupe_corr = 0.7        # 去重: train 共同行上信号相关系数绝对值 >= 此值归入同一代表
extra_lag_t_min = 2.0    # xlag_weak 提示: 信号再多滞后一天后 |t| 低于此值(或变号)
