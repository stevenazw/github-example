# 第二版(v2, 事先登记): 相对 v1(configs/ty_roll.toml)只有两处改动 ——
#   1) entry_z = 2.5: 新因子的入选门槛 |z| 由 run 配置的 z_weak 提高到 2.5(留任门槛 stay_z 不变);
#   2) confirm_periods = 2: 新因子必须在连续两个重挖日(同一规格、同一符号)都通过入选规则才持有, 第一期因此空仓,
#      汇总统计从 D_1 之后第一个持有日起算(空仓期不计入)。
# 只有一个事先登记的规格(窗口 3 年、每 6 个月重挖), 不带 [rolling.grid]。
# 事先声明的判定规则: 「封存期只在评估期净 Sharpe > 0.3 时打开一次；否则判定第二版不成立，封存期保留」
# TY 滚动挖掘(walk-forward)配置: 用 `python -m tsminer roll configs/ty_roll.toml RUN_DIR... --out DIR` 运行。
# 验证的是"选择规则", 不是"某个因子是否永远有效": 每个重挖日只用此前 window_years 年的行选因子,
# 持有到下一个重挖日, 再看被选中的集合在之后的表现; 每个持有日相对选出它的那次选择都是样本外。
# 入口门槛(z_weak / is_min_net_sharpe / dedupe_corr)、统计设置、缓冲带与成本取自各 run 的 config.toml。

[rolling]
window_years = 3          # 滚动挖掘窗口(年)
step_months = 6           # 重挖频率(月)
first_date = "2005-01-01" # 第一个重挖日 = 该日期当天或之后的第一个标的交易日
holdout_years = 3         # 标的最后这几个自然年封存: 不读取、不评估
entry_z = 2.5             # 新因子入选门槛 |z|(v1: 取 run 配置的 z_weak)
confirm_periods = 2       # 确认(seasoning): 连续 2 个重挖日同号通过入选规则才持有(v1: 1)
stay_z = 1.0              # 在持因子: 符号不变且 |z| >= stay_z 则继续持有(无净 Sharpe 条件)
group_cap = 0.3334        # 单个 group 的总权重上限
coverage = 0.8            # 候选在窗口内至少要有这个比例的有限值行
