# TY 变量清单配置（研究者给定的变量，而不是盲扫候选池）。
# - 候选池 = [[universe.variable]] 里的 63 个公式变量; 每个变量由一条或多条底层序列按公式构造
#   (利差、比值、多腿组合、累加、已实现波动率等), 系统对每个变量照旧做 6 个固定变换并逐个检验。
# - 不预设方向: 每个变量一律双边检验, 方向由样本内符号决定。
# - 可得性规则是【输入】, 由研究者确认: 每条底层序列先按自己的规则 as-of 对齐并滞后, 再做公式运算;
#   任何一条底层序列没有规则, 该变量被拒收(no_availability_rule)并在 excluded 里列出缺规则的叶子。
# - 叶子函数: ts(ticker[, field]) 存量; flow(ticker, field) 流量(累加到下一个日历行, 不向前填充);
#   chain(root, column) 期货连续合约的一列; curve(name, measure, start_tenor, tenor) 库内曲线点;
#   ref(id) 引用另一个变量或 helper 的未变换取值。运算函数: lag diff dlog sign nz cumsum rvol。
# - 本文件的 [target] / [databank] / [sample] / [signals] / [stats] / [verdict] / [position] 与 configs/ty.toml 相同。

[target]
name = "TY"
kind = "futures_chain"      # "futures_chain" | "spot"
root = "TY"                 # used by futures_chain
# ticker / field             # used by spot: log difference of PX_LAST is the daily return
cost_per_side = 0.00014     # 单边成本(收益率单位): TY 半个 tick 1/64 点 ÷ 价格约 110

[databank]
toolkit_dir = "/home/user/databank-work/entry"
cache_dir = "/home/user/databank-work/databank-cache"

[sample]
start = ""                  # 可选 ISO 日期; 空 = 标的全部历史
is_frac = 0.70              # 每个候选在自己与标的重叠的有效行内切成: 样本内 IS 70% / 观察期 OBS 15% / 样本外 OOS 15%
obs_frac = 0.15

[universe]
fields = ["PX_LAST", "CFTC_CONTRACTS"]   # 字段优先级: ts(ticker) 省略字段时取该 ticker 拥有的第一个

[lags]
# 可得性(availability)是【输入】, 由研究者确认, 系统不猜测、不套默认值。数值含义: t 日收盘的信号只能用日期 <= t-lag 的观测。
# 优先级: ts / flow 叶子: [lags.ticker] 精确 ticker > [lags.field] 字段名 > [lags.class] 的 "class_one/class_two";
#         chain 叶子: [lags.field] 里键 "chain:<column>" > chain; curve 叶子: [lags.curve] 的曲线名。
chain = 0      # 期货连续合约: 不滞后

[lags.class]
"Market_Data/Government_Bond" = 0
"Market_Data/Money_Market" = 0
"Market_Data/Swap_OIS" = 0
"Market_Data/VOL" = 1
"Market_Data/Commodity" = 0
"Market_Data/Equity" = 0
"Market_Data/Inflation_Linked" = 0
"Market_Data/Credit" = 0
"Market_Data/MBS" = 0
"Market_Data/FX" = 0
"Macro/Global" = 1
"Macro/US" = 1
"Positioning/CFTC_COT" = 4     # 周二数据、周五 15:30 ET 发布 -> 下周一可用
"FED/Balance_Sheet" = 2        # 周三数据、周四 16:30 ET 发布 -> 周五可用
"FED/Primary_Dealer" = 8       # 周三数据、下周四发布 -> 保守取 8

[lags.ticker]
"NFCIINDX Index" = 6

[lags.field]
"FUND_FLOW" = 1                       # ETF 资金流: 滞后 1 天(研究者确认)
"EQY_SH_OUT" = 1
"FUND_NET_ASSET_VAL" = 1
"1M_CALL_IMP_VOL_25DELTA_DFLT" = 1    # 隐含波动率: 滞后 1 天(研究者确认)
"1M_PUT_IMP_VOL_25DELTA_DFLT" = 1
"CONVENTIONAL_CTD_FORWARD_FRSK" = 1
"VOLUME" = 0
"OPEN_INT" = 1                        # 持仓量(futures_oi 叶子): 交易所次日公布, 起草为滞后 1 天, 待研究者确认

[lags.curve]
"USD_SOFR_OIS" = 0

# ---------------------------------------------------------------- helper（只供 ref() 引用，不是候选）
# 缩写: PUT = 1M_PUT_IMP_VOL_25DELTA_DFLT, CALL = 1M_CALL_IMP_VOL_25DELTA_DFLT, FRSK = CONVENTIONAL_CTD_FORWARD_FRSK
# oi_*: futures_oi(root) = 该品种所有具体合约持仓量之和(换月不断崖); skew_*: clean(x, 60, 10) 因果离群点过滤(只用于偏度: 已知坏点只体现在偏度上, 波动率水平不过滤以保留危机时期的真实行情)。
# aum_*: ETF 规模取前一日 (lag(..., 1)); fl_*: ETF 资金流 (flow 叶子)。
[[universe.helper]]
id = "iv_ty"
expr = "(ts('TY1 Comdty','1M_PUT_IMP_VOL_25DELTA_DFLT') + ts('TY1 Comdty','1M_CALL_IMP_VOL_25DELTA_DFLT')) / 2"

[[universe.helper]]
id = "iv_tu"
expr = "(ts('TU1 Comdty','1M_PUT_IMP_VOL_25DELTA_DFLT') + ts('TU1 Comdty','1M_CALL_IMP_VOL_25DELTA_DFLT')) / 2"

[[universe.helper]]
id = "iv_us"
expr = "(ts('US1 Comdty','1M_PUT_IMP_VOL_25DELTA_DFLT') + ts('US1 Comdty','1M_CALL_IMP_VOL_25DELTA_DFLT')) / 2"

[[universe.helper]]
id = "skew_ty"
expr = "clean(ts('TY1 Comdty','1M_PUT_IMP_VOL_25DELTA_DFLT') - ts('TY1 Comdty','1M_CALL_IMP_VOL_25DELTA_DFLT'), 60, 10)"

[[universe.helper]]
id = "skew_tu"
expr = "clean(ts('TU1 Comdty','1M_PUT_IMP_VOL_25DELTA_DFLT') - ts('TU1 Comdty','1M_CALL_IMP_VOL_25DELTA_DFLT'), 60, 10)"

