# TY 配方源列配置（由《Duration Trading 底层因子配方与 EOD 可用时间》第 4 节的 135 条配方程序化生成，2026-11-24）。
# - 只取每条配方的“日频源列”（输入 -> 日频源列这一段），按表达式去重后得到 93 个公式变量；
#   文档里的周度变换、156 锚点标准化、C/B/T 映射、样本起点、OOS 起点都【不】进入本配置:
#   变量走系统现有的 7 个固定变换和 70/15/15 切分, 每个变量的注释里列出文档中用到它的 factor_id。
# - 滞后单位是标的交易日(文档第 1 节写作“自然日”, 此处按本项目规则解释); 规则见 [lags], 均为文档第 3 节已验证的取值。
# - OPEN_INT 用近月连续合约(XX1 Comdty)的字段, 与文档一致, 不是 futures_oi() (换月日会有持仓量断崖, 照文档不改)。
# - FF 政策利率 policy 只用 (FDTR + FDTRFTRL) / 2: 配方样本自 2010 年起, 两条上下限序列自 2005 年起都有,
#   文档中缺失时改用 FEDL01 的备用分支在此不会触发, 因而未实现。
# - 本文件的 [target] / [databank] / [sample] / [signals] / [stats] / [verdict] / [position] 与 configs/ty_vars.toml 相同。

[target]
name = "TY"
kind = "futures_chain"      # "futures_chain" | "spot"
root = "TY"                 # used by futures_chain
# ticker / field             # used by spot: log difference of PX_LAST is the daily return
cost_per_side = 0.00014     # 单边成本(收益率单位): TY 半个 tick 1/64 点 ÷ 价格约 110

[databank]
toolkit_dir = "/home/user/databank-work/entry"
cache_dir = "/home/user/databank-work/databank-cache"

[sample]
start = ""                  # 可选 ISO 日期; 空 = 标的全部历史
is_frac = 0.70              # 每个候选在自己与标的重叠的有效行内切成: 样本内 IS 70% / 观察期 OBS 15% / 样本外 OOS 15%
obs_frac = 0.15

[universe]
fields = ["PX_LAST", "CFTC_CONTRACTS"]   # 字段优先级: ts(ticker) 省略字段时取该 ticker 拥有的第一个

[lags]
# 可得性(availability)是【输入】, 不是系统推断的结果: 没有规则的序列会被拒收(no_availability_rule)。
# 单位是【标的交易日】(标的日历的行): 每条序列先 as-of 对齐到标的日历(取日期 <= 当天的最近观测), 再向后移 lag 行,
# 即 t 日收盘的信号只能用日期 <= t-lag 的观测。信号在 t 日收盘后形成, 在其后第 execution_delay 个标的收盘成交
# (见 [position]), 新仓从成交后才承担收益。
# 规则出处分三档, 由本段的 verified / confirmed 两个列表登记(元素是规则键, 格式同 meta.lag_rule):
#   verified  = 已验证: 来自 factor_bank《Duration Trading 底层因子配方与 EOD 可用时间》(2026-11-24);
#   confirmed = 研究者确认: 研究者口头确认, 文档未覆盖;
#   不在两个列表里的规则 = 起草, 待确认。
# 优先级: 一个 ticker 有多个不同滞后的字段时(如 TY1 Comdty)不写 ticker 规则, 靠字段规则。
#   ts / flow 叶子: [lags.ticker] 精确 ticker > [lags.field] 字段名 > [lags.class] 的 "class_one/class_two";
#   chain 叶子: [lags.field] 里键 "chain:<column>" > chain; curve 叶子: [lags.curve] 的曲线名。
chain = 0
verified = [
  "field:FUND_FLOW", "field:1M_CALL_IMP_VOL_25DELTA_DFLT", "field:1M_PUT_IMP_VOL_25DELTA_DFLT",
  "field:OPEN_INT", "curve:USD_SOFR_OIS", "ticker:CESIUSD Index",
  "ticker:CESIG10 Index", "ticker:FDTR Index", "ticker:FDTRFTRL Index",
  "ticker:FEDL01 Index", "ticker:FF1 Comdty", "ticker:FF2 Comdty",
  "ticker:FF3 Comdty", "ticker:FF4 Comdty", "ticker:FF5 Comdty",
  "ticker:FF6 Comdty", "ticker:FF7 Comdty", "ticker:FF8 Comdty",
  "ticker:FF9 Comdty", "ticker:FF10 Comdty", "ticker:FF11 Comdty",
  "ticker:FF12 Comdty", "ticker:FF13 Comdty", "ticker:FF14 Comdty",
  "ticker:FF15 Comdty", "ticker:FF16 Comdty", "ticker:FF17 Comdty",
  "ticker:FF18 Comdty", "ticker:FF19 Comdty", "ticker:FF20 Comdty",
  "ticker:FF21 Comdty", "ticker:FF22 Comdty", "ticker:FF23 Comdty",
  "ticker:FF24 Comdty", "ticker:SPGSAGTR Index", "ticker:SPGSALTR Index",
  "ticker:SPGSCITR Index", "ticker:SPGSCLTR Index", "ticker:SPGSCRTR Index",
  "ticker:SPGSENTR Index", "ticker:SPGSINTR Index", "ticker:SPGSNETR Index",
  "ticker:SPGSPMTR Index", "ticker:SPGSRETR Index", "ticker:SPGSUETR Index",
  "ticker:SPGSXNTR Index", "ticker:SPGSXPTR Index", "ticker:GSPRHIMO Index",
  "ticker:GSPRHVMS Index", "ticker:GSXUCYCL Index", "ticker:GSXUDEFS Index",
  "ticker:GSXUMFML Index", "ticker:GSXUMFMS Index",
]
confirmed = [
  "chain", "class:Market_Data/Government_Bond", "class:Market_Data/Money_Market",
  "class:Market_Data/Swap_OIS", "class:Market_Data/Commodity", "class:Market_Data/Equity",
  "class:Market_Data/Inflation_Linked", "class:Market_Data/Credit", "class:Market_Data/MBS",
  "class:Market_Data/FX", "class:Market_Data/VOL",
]

